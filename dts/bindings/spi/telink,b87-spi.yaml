# SPDX-License-Identifier: Apache-2.0

description: |
  TLSR8278 SPI master (DS-TLSR8278 7.4): its registers 0x08-0x0b. The pins
  come from the pin controller (pinctrl-0): CK on PA4 or PD7, DO on PA2 or
  PB7, DI on PA3 or PB6, and the master's own chip select on PD2; clocks
  names its module clock.

compatible: "telink,b87-spi"

include: [spi-controller.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true

  clocks:
    required: true

  pinctrl-0:
    required: true

  pinctrl-names:
    required: true
