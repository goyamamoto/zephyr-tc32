# SPDX-License-Identifier: Apache-2.0

description: Telink TLSR8258 GPIO port

compatible: "telink,tlsr8258-gpio"

include: [gpio-controller.yaml, base.yaml]

properties:
  reg:
    required: true

  "#gpio-cells":
    const: 2

  interrupts:
    required: true

  interrupt-parent:
    required: true

gpio-cells:
  - pin
  - flags
