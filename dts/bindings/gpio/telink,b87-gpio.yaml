# SPDX-License-Identifier: Apache-2.0

description: Telink B87 GPIO port

compatible: "telink,b87-gpio"

include: [gpio-controller.yaml, base.yaml]

properties:
  reg:
    required: true

  "#gpio-cells":
    const: 2

  interrupts:
    required: true

  interrupt-parent:
    required: true

gpio-cells:
  - pin
  - flags
